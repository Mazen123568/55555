<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebView لتشغيل البث</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      font-family: 'Cairo', sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="loading">⏳ جاري تحميل البث...</div>

<iframe src="https://mazen123568.github.io/55555/vlc%20test.html" 
        onload="document.querySelector('.loading').style.display='none';">
</iframe>

</body>
</html>
