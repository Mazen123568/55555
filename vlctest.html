<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البث المباشر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #0d0d0d; color: #fff; overflow: hidden; }

    .page {
      position: absolute;
      top: 0; left: 100%;
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all 0.5s ease;
    }
    .page.active { left: 0; }
    .page.exit-left { left: -100%; }

    button {
      background: #ffcc00;
      color: #000;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }
    button:hover { background: #ffdb4d; }

    h1 { margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- الصفحة 1 -->
  <div class="page active" id="home">
    <h1>مرحبًا بك في البث المباشر 🎥</h1>
    <button onclick="goTo('groups')">📺 البث المباشر</button>
  </div>

  <!-- الصفحة 2 -->
  <div class="page" id="groups">
    <h1>اختر مجموعة القنوات</h1>
    <button onclick="goTo('channels', 'الرياضة')">⚽ الرياضة</button>
    <button onclick="goTo('channels', 'الأخبار')">📰 الأخبار</button>
    <button onclick="goTo('home')">⬅️ رجوع</button>
  </div>

  <!-- الصفحة 3 -->
  <div class="page" id="channels">
    <h1 id="groupTitle">القنوات</h1>
    <div id="channelButtons"></div>
    <button onclick="goTo('groups')">⬅️ رجوع</button>
  </div>

  <script>
    const pages = document.querySelectorAll('.page');
    let currentPage = 'home';

    const channels = {
      'الرياضة': [
        { name: 'SSC 1', url: 'http://example.com/ssc1.m3u8' },
        { name: 'beIN Sports', url: 'http://example.com/bein.m3u8' }
      ],
      'الأخبار': [
        { name: 'العربية', url: 'http://example.com/al3rabia.m3u8' },
        { name: 'الجزيرة', url: 'http://example.com/aljazeera.m3u8' }
      ]
    };

    function goTo(targetId, groupName = null) {
      const current = document.getElementById(currentPage);
      const target = document.getElementById(targetId);

      current.classList.remove('active');
      current.classList.add('exit-left');
      setTimeout(() => {
        current.classList.remove('exit-left');
      }, 500);

      target.classList.add('active');
      currentPage = targetId;

      if (targetId === 'channels' && groupName) {
        showChannels(groupName);
      }
    }

    function showChannels(groupName) {
      document.getElementById('groupTitle').innerText = `قنوات ${groupName}`;
      const container = document.getElementById('channelButtons');
      container.innerHTML = '';

      channels[groupName].forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = ch.name;
        btn.onclick = () => openInVLC(ch.url);
        container.appendChild(btn);
      });
    }

    function openInVLC(url) {
      const vlcIntent = `intent:${url}#Intent;package=org.videolan.vlc;type=video/*;end`;

      try {
        window.location.href = vlcIntent;

        setTimeout(() => {
          if (document.hidden === false) {
            alert('يبدو أن تطبيق VLC غير مثبت على جهازك. سيتم توجيهك إلى متجر Google Play لتحميله.');
            window.location.href = 'https://play.google.com/store/apps/details?id=org.videolan.vlc';
          }
        }, 1500);
      } catch (e) {
        window.location.href = 'https://play.google.com/store/apps/details?id=org.videolan.vlc';
      }
    }
  </script>

</body>
</html>
