<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>فلكسي TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    #videoPlayer { width: 100%; background: black; aspect-ratio: 16/9; }
    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-900 text-white p-4 min-h-screen text-sm sm:text-base">

  <!-- الشعار -->
  <div class="flex justify-center items-center mb-6">
    <img src="https://www.arabseed.stream/images/67fcb12ad4171ic_launcher.png" alt="Flicksy Logo" class="w-12 h-12 mr-2" />
    <h1 class="text-2xl font-bold text-center">📺</h1>
  </div>

  <!-- زر الدخول -->
  <div id="adminAccess" class="mb-6">
    <button onclick="checkPassword()" class="bg-600 px-4 py-2 rounded">🔐 </button>
  </div>

  <!-- نموذج الاستيراد -->
  <div id="uploadForm" class="mb-6 space-y-4 hidden">
    <input type="file" id="m3uFile" accept=".m3u,.txt" class="bg-gray-800 p-2 rounded w-full" />
    <input type="text" id="m3uUrl" placeholder="🌐 أدخل رابط M3U مباشر" class="bg-gray-800 p-2 rounded w-full" />
    <button type="button" id="loadUrl" class="bg-green-600 py-2 px-4 rounded w-full">📥 استيراد من رابط</button>

    <div class="bg-gray-800 p-3 rounded space-y-2">
      <h2 class="font-bold text-sm text-yellow-400">🌐 استيراد من Xtream Codes</h2>
      <input type="text" id="xtreamHost" placeholder="🛰️ رابط السيرفر (http://host:port)" class="w-full p-1 rounded bg-gray-700 text-sm" />
      <input type="text" id="xtreamUser" placeholder="👤 اسم المستخدم" class="w-full p-1 rounded bg-gray-700 text-sm" />
      <input type="password" id="xtreamPass" placeholder="🔑 كلمة المرور" class="w-full p-1 rounded bg-gray-700 text-sm" />
      <button type="button" onclick="loadXtream()" class="bg-blue-700 py-2 px-4 rounded w-full">📡 استيراد من Xtream</button>
    </div>
  </div>

  <!-- زر تحميل القنوات المحفوظة -->
  <div class="relative group mb-4">
    <button type="button" onclick="loadSavedChannels()" class="bg-purple-500 py-2 px-4 rounded w-full">
        تحديث  🚀 🚀 🚀  البث 
    </button>
  </div>

  <!-- البحث + الفلاتر -->
  <input type="text" id="searchInput" placeholder="🔍 ابحث عن قناة..." class="w-full p-2 mb-4 bg-gray-800 rounded" />
  <div class="flex gap-4 mb-6">
    <button id="categoryDropdownBtn" class="bg-blue-700 px-4 py-1 rounded-full">📂 اختر تصنيف</button>
    <button onclick="displayFavorites()" class="bg-yellow-600 px-4 py-1 rounded-full">⭐ المفضلة</button>
  </div>
  <div id="categoriesBar" class="absolute hidden mt-2 w-56 max-h-72 overflow-y-auto rounded-md shadow-lg bg-gray-800 ring-1 ring-black ring-opacity-5 z-20"></div>

  <!-- المشغل -->
  <div id="playerContainer" class="relative hidden mb-6">
    <div id="loadingSpinner" class="hidden absolute inset-0 flex items-center justify-center bg-black bg-opacity-60 z-10">
      <div class="spinner"></div>
    </div>
    <video id="videoPlayer" controls></video>
    <div class="mt-2 flex gap-2 justify-center">
      <button onclick="closePlayer()" class="bg-red-700 px-4 py-1 rounded pulse">❌ إغلاق</button>
      <button onclick="playLastChannel()" class="bg-yellow-500 px-4 py-1 rounded">🔁 القناة السابقة</button>
    </div>
  </div>

  <!-- القنوات -->
  <div id="channelGroups" class="space-y-6"></div>

  <!-- إشعارات -->
  <div id="favNotification" class="fixed bottom-4 right-4 bg-yellow-600 text-black px-4 py-2 rounded shadow-lg hidden z-50">
    ✅ تم الإضافة إلى المفضلة
  </div>
  <div id="loadingNotice" class="fixed bottom-4 right-4 bg-blue-600 text-white px-4 py-2 rounded shadow-lg hidden z-50">
    ⏳ جارٍ تحميل القنوات...
  </div>

  <!-- صوت عند التشغيل -->
  <audio id="startSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_f93c5643bf.mp3?filename=tweet.mp3" preload="auto"></audio>

  <!-- سكربتات -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const player = new Plyr('#videoPlayer');
    const video = document.getElementById('videoPlayer');
    const categoryBtn = document.getElementById('categoryDropdownBtn');
    const categoryMenu = document.getElementById("categoriesBar");
    const spinner = document.getElementById("loadingSpinner");
    let allChannels = [], lastChannelUrl = null, showingFavorites = false;

    function checkPassword() {
      const input = prompt("🔐 أدخل كلمة المرور:");
      if (input === "55555") {
        document.getElementById('uploadForm').classList.remove('hidden');
        document.getElementById('adminAccess').classList.add('hidden');
      } else {
        alert("❌ كلمة المرور غير صحيحة");
      }
    }

    function parseM3U(content) {
      const lines = content.split('\n');
      const channels = [];
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith('#EXTINF')) {
          const title = lines[i].split(',')[1]?.trim() || 'بدون اسم';
          const logo = lines[i].match(/tvg-logo="(.*?)"/)?.[1] || 'https://via.placeholder.com/100x100';
          const group = lines[i].match(/group-title="(.*?)"/)?.[1] || 'غير مصنف';
          const url = lines[i + 1]?.trim();
          if (url?.startsWith('http')) channels.push({ title, logo, group, url });
        }
      }
      allChannels = channels;
      updateCategoryBar();
      displayChannels();
    }

    function updateCategoryBar() {
      categoryMenu.innerHTML = '';
      const groups = [...new Set(allChannels.map(c => c.group))];
      const allBtn = document.createElement('button');
      allBtn.textContent = 'كل القنوات';
      allBtn.className = 'block w-full text-right px-4 py-2 text-sm hover:bg-gray-700';
      allBtn.onclick = () => {
        categoryBtn.textContent = '📂 كل القنوات';
        displayChannels('all');
        categoryMenu.classList.add('hidden');
      };
      categoryMenu.appendChild(allBtn);
      groups.forEach(group => {
        const btn = document.createElement('button');
        btn.textContent = group;
        btn.className = 'block w-full text-right px-4 py-2 text-sm hover:bg-gray-700';
        btn.onclick = () => {
          categoryBtn.textContent = `📂 ${group}`;
          displayChannels(group);
          categoryMenu.classList.add('hidden');
        };
        categoryMenu.appendChild(btn);
      });
    }

    function displayChannels(selected = 'all') {
      const container = document.getElementById('channelGroups');
      container.innerHTML = '';
      const groups = [...new Set(allChannels.map(c => c.group))];
      groups.forEach(group => {
        if (selected !== 'all' && selected !== group) return;
        const section = document.createElement('div');
        section.innerHTML = `<h2 class="text-xl font-bold mb-2">${group}</h2>`;
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4';
        allChannels.filter(c => c.group === group).forEach(channel => {
          const card = document.createElement('div');
          card.className = 'bg-gray-800 p-2 rounded hover:scale-105 transition';
          const isFavorite = getFavorites().includes(channel.url);
          card.innerHTML = `
            <img src="${channel.logo}" class="w-full object-contain rounded mx-auto" style="max-height: 60px;" />
            <div class="text-sm mt-2 text-center truncate">${channel.title}</div>
            <button onclick="toggleFavorite(event, '${channel.url}')" class="mt-1 text-yellow-400 text-xs hover:underline">
              ${isFavorite ? '⭐ إزالة من المفضلة' : '☆ أضف إلى المفضلة'}
            </button>`;
          card.addEventListener('click', e => {
            if (e.target.tagName !== 'BUTTON') checkAndPlayChannel(channel.url);
          });
          grid.appendChild(card);
        });
        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    // 🔹 دالة جديدة للتحقق وتشغيل القناة داخليًا أو خارجيًا
    function checkAndPlayChannel(url) {
      spinner.classList.remove("hidden");
      testStream(url)
        .then(isWorking => {
          spinner.classList.add("hidden");
          if (isWorking) {
            playChannel(url);
          } else {
            openInExternalPlayer(url);
          }
        })
        .catch(() => {
          spinner.classList.add("hidden");
          openInExternalPlayer(url);
        });
    }

    // 🔍 اختبار عمل الرابط قبل التشغيل الداخلي
    function testStream(url) {
      return new Promise((resolve) => {
        const testVideo = document.createElement('video');
        testVideo.src = url;
        testVideo.muted = true;
        testVideo.play()
          .then(() => { testVideo.pause(); resolve(true); })
          .catch(() => { resolve(false); });
        setTimeout(() => resolve(false), 5000);
      });
    }

    // 🎬 فتح الرابط في MX Player أو متجر Play إذا لم يكن مثبتًا
    function openInExternalPlayer(url) {
      alert("⚠️ سيتم فتح القناة في MX Player...");
      const mxIntent = `intent:${url}#Intent;package=com.mxtech.videoplayer.ad;scheme=http;end`;
      const playStoreUrl = "https://play.google.com/store/apps/details?id=com.mxtech.videoplayer.ad";
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = mxIntent;
      document.body.appendChild(iframe);
      setTimeout(() => {
        document.body.removeChild(iframe);
        window.open(playStoreUrl, '_blank');
      }, 2000);
    }

    function playChannel(url) {
      if (Hls.isSupported()) {
        if (window.hls) window.hls.destroy();
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        window.hls = hls;
      } else {
        video.src = url;
      }
      video.play();
      document.getElementById('startSound').play().catch(() => {});
      lastChannelUrl = url;
      document.getElementById('playerContainer').classList.remove('hidden');
      document.getElementById('channelGroups').classList.add('hidden');
      document.getElementById('playerContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function closePlayer() {
      if (window.hls) window.hls.destroy();
      video.pause();
      document.getElementById('playerContainer').classList.add('hidden');
      document.getElementById('channelGroups').classList.remove('hidden');
    }

    function playLastChannel() { if (lastChannelUrl) checkAndPlayChannel(lastChannelUrl); }
    function getFavorites() { return JSON.parse(localStorage.getItem('favorites') || '[]'); }

    function toggleFavorite(event, url) {
      event.stopPropagation();
      let favorites = getFavorites();
      if (favorites.includes(url)) {
        favorites = favorites.filter(f => f !== url);
        showFavoriteNotification('🚫 تمت الإزالة من المفضلة');
      } else {
        favorites.push(url);
        showFavoriteNotification();
      }
      localStorage.setItem('favorites', JSON.stringify(favorites));
      displayChannels();
    }

    function showFavoriteNotification(msg = '✅ تم الإضافة إلى المفضلة') {
      const notif = document.getElementById('favNotification');
      notif.textContent = msg;
      notif.classList.remove('hidden');
      setTimeout(() => notif.classList.add('hidden'), 2000);
    }

    function displayFavorites() {
      const btn = event.target;
      if (showingFavorites) {
        const savedContent = localStorage.getItem('savedM3UContent');
        const savedUrl = localStorage.getItem('savedM3UUrl');
        if (savedContent) parseM3U(savedContent);
        else if (savedUrl) fetch(savedUrl).then(r => r.text()).then(parseM3U);
        btn.textContent = '⭐ المفضلة';
        showingFavorites = false;
      } else {
        const favs = getFavorites();
        const filtered = allChannels.filter(c => favs.includes(c.url));
        allChannels = filtered;
        displayChannels('all');
        btn.textContent = '↩️ رجوع للتصنيفات';
        showingFavorites = true;
      }
    }

    function loadSavedChannels() {
      const notice = document.getElementById('loadingNotice');
      notice.classList.remove('hidden');
      const savedContent = localStorage.getItem('savedM3UContent');
      const savedUrl = localStorage.getItem('savedM3UUrl');
      const onComplete = () => setTimeout(() => notice.classList.add('hidden'), 1000);
      if (savedContent) { parseM3U(savedContent); onComplete(); }
      else if (savedUrl) { fetch(savedUrl).then(res => res.text()).then(parseM3U).finally(onComplete); }
      else { alert("❌ لا توجد قنوات محفوظة"); onComplete(); }
    }

    document.getElementById('m3uFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const content = e.target.result;
        localStorage.setItem('savedM3UContent', content);
        localStorage.removeItem('savedM3UUrl');
        parseM3U(content);
        const notif = document.getElementById('loadingNotice');
        notif.textContent = "✅ تم حفظ القنوات بنجاح";
        notif.classList.remove("hidden");
        setTimeout(() => { notif.classList.add("hidden"); notif.textContent = "⏳ جارٍ تحميل القنوات..."; }, 2000);
      };
      reader.readAsText(file);
    });

    document.getElementById('loadUrl').addEventListener('click', () => {
      const url = document.getElementById('m3uUrl').value.trim();
      if (!url) return alert('❌ أدخل رابط صالح');
      fetch(url)
        .then(res => res.text())
        .then(content => {
          localStorage.setItem('savedM3UUrl', url);
          localStorage.removeItem('savedM3UContent');
          parseM3U(content);
        })
        .catch(() => alert('❌ تعذر تحميل الرابط'));
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      const filtered = allChannels.filter(ch => ch.title.toLowerCase().includes(term));
      allChannels = filtered;
      displayChannels('all');
    });

    window.onload = () => {
      const savedContent = localStorage.getItem('savedM3UContent');
      const savedUrl = localStorage.getItem('savedM3UUrl');
      if (savedContent) parseM3U(savedContent);
      else if (savedUrl) fetch(savedUrl).then(res => res.text()).then(parseM3U);
      else {
        const defaultUrl = "https://iptv-org.github.io/iptv/countries/sa.m3u";
        fetch(defaultUrl)
          .then(res => res.text())
          .then(content => { localStorage.setItem('savedM3UUrl', defaultUrl); parseM3U(content); })
          .catch(() => alert("❌ تعذر تحميل القنوات من الرابط الافتراضي"));
      }
    };

    categoryBtn.addEventListener('click', () => { categoryMenu.classList.toggle('hidden'); });
  </script>
</body>
</html>
