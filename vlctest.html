<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV + AdMob تجربة</title>
<style>
  body { font-family: 'Cairo', sans-serif; background: #0a0a0a; color: #fff; padding: 20px; text-align: center; }
  h1 { color: #00ffd1; text-shadow: 0 0 10px #00ffd1; }
  button { background: #00ffd1; border: none; border-radius: 20px; padding: 12px 25px; margin: 10px; color: #000; cursor: pointer; }
  .log { margin-top: 20px; color: #fff; text-align: left; max-height: 150px; overflow-y: auto; background: #111; padding: 10px; border-radius: 10px; }
  .banner-ad { width: 320px; height: 50px; background: #ffcc00; color: #000; line-height: 50px; margin: 20px auto; border-radius: 10px; font-weight: bold; }
</style>
</head>
<body>

<h1>💰 تجربة AdMob + IPTV</h1>

<div id="banner" class="banner-ad">بانر إعلان تجريبي</div>

<button onclick="showInterstitial()">إعلان بيني تجريبي</button>

<div class="log" id="log">Logs:</div>

<h2>قنوات IPTV</h2>
<div id="channelsList"></div>

<script>
  const logEl = document.getElementById("log");
  function log(msg){ logEl.innerHTML += '<br>➡️ '+msg; }

  // Fake Interstitial
  function showInterstitial(){
    alert("إعلان بيني تجريبي 🎬");
    log("تم عرض الإعلان البيني التجريبي");
  }

  // Example Channels
  const channels = [
    { name:"قناة رياضية 1", url:"https://shls-live-enc.edgenextcdn.net/out/v1/.../index_3.m3u8" },
    { name:"قناة رياضية 2", url:"https://shls-live-enc.edgenextcdn.net/out/v1/.../index_3.m3u8" },
    { name:"قناة أفلام 1", url:"https://shls-live-enc.edgenextcdn.net/out/v1/.../index_5.m3u8" }
  ];

  const channelsList = document.getElementById("channelsList");
  channels.forEach((ch, idx)=>{
    const btn = document.createElement("button");
    btn.textContent = ch.name;
    btn.onclick = ()=>{ alert("تشغيل القناة: "+ch.url); log("تم اختيار "+ch.name); };
    channelsList.appendChild(btn);
  });

  // AdMob fake config for WebView placeholder
  const isWebView = /wv|Android|iPhone|iPad/i.test(navigator.userAgent);
  if(isWebView){
    log("يتم عرض الصفحة داخل WebView. يمكن ربط AdMob حقيقي هنا.");
    // هنا يمكن إضافة كود median.admob.configure() عند تشغيل التطبيق
  } else {
    log("تجربة في المتصفح فقط. الإعلانات وهمية الآن.");
  }
</script>

</body>
</html>
