<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشغيل البث في VLC</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top, #0a0a0a, #000);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #00ffd1;
      text-shadow: 0 0 10px #00ffd1;
    }

    p {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 40px;
    }

    button {
      background: linear-gradient(135deg, #00ffd1, #0072ff);
      border: none;
      border-radius: 40px;
      padding: 16px 40px;
      font-size: 18px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px #00ffd1;
    }

    .note {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }

    .install-link {
      display: none;
      margin-top: 15px;
      color: #00ffd1;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid #00ffd1;
      padding: 10px 20px;
      border-radius: 25px;
      transition: 0.3s;
    }

    .install-link:hover {
      background: #00ffd1;
      color: #000;
    }
  </style>
</head>
<body>

  <h2>🎬 تشغيل البث عبر VLC</h2>
  <p>اضغط على الزر لتشغيل البث في تطبيق VLC مباشرة</p>

  <button onclick="openInVLC('https://shls-live-enc.edgenextcdn.net/out/v1/08eca926a78a41339b8010c882410307/index_3.m3u8')">
    ▶️ تشغيل البث
  </button>

  <div class="note" id="note"></div>
  <a id="installLink" class="install-link" target="_blank">تحميل VLC</a>

  <script>
    function openInVLC(streamUrl) {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const tempUrl = streamUrl + (streamUrl.includes('?') ? '&' : '?') + 'nocache=' + Date.now();

      const note = document.getElementById("note");
      const installLink = document.getElementById("installLink");
      installLink.style.display = "none";

      let targetUrl = "";
      let downloadUrl = "";

      if (/android/i.test(userAgent)) {
        // Android
        targetUrl = `intent://${tempUrl.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;end`;
        downloadUrl = "https://play.google.com/store/apps/details?id=org.videolan.vlc";
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        // iOS
        targetUrl = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(tempUrl)}`;
        downloadUrl = "https://apps.apple.com/app/vlc-for-mobile/id650377962";
      } else {
        // Desktop (Windows, Mac, Linux)
        targetUrl = `vlc://${tempUrl}`;
        downloadUrl = "https://www.videolan.org/vlc/";
      }

      // افتح VLC
      window.location.href = targetUrl;

      // بعد 2 ثانية، إذا لم يُفتح VLC، أظهر رسالة التثبيت
      setTimeout(() => {
        note.innerHTML = "⚠️ إذا لم يتم فتح VLC تلقائيًا، يمكنك تحميله من الرابط أدناه:";
        installLink.href = downloadUrl;
        installLink.style.display = "inline-block";
      }, 2000);
    }
  </script>

</body>
</html>
