<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل القنوات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top, #0a0a0a, #000);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    h2 {
      color: #00ffd1;
      text-shadow: 0 0 10px #00ffd1;
    }

    button {
      background: linear-gradient(135deg, #00ffd1, #0072ff);
      border: none;
      border-radius: 40px;
      padding: 16px 40px;
      font-size: 18px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin: 10px;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px #00ffd1;
    }

    section { display: none; }
    .active { display: block; }

    .note {
      margin-top: 40px;
      font-size: 14px;
      color: #aaa;
    }

    .install-link {
      display: none;
      margin-top: 15px;
      color: #00ffd1;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid #00ffd1;
      padding: 10px 20px;
      border-radius: 25px;
      transition: 0.3s;
    }

    .install-link:hover {
      background: #00ffd1;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- الصفحة 1: الرئيسية -->
  <section id="page1" class="active">
    <h2>🎬الاسطورة tv+</h2>
    <p>اضغط للانتقال إلى مجموعات القنوات</p>
    <button onclick="showPage('page2')">📺 عرض المجموعات</button>
  </section>

  <!-- الصفحة 2: مجموعات القنوات -->
  <section id="page2">
    <h2>📚 مجموعات القنوات</h2>
    <button onclick="selectGroup('sports')">⚽ رياضية</button>
    <button onclick="selectGroup('news')">📰 إخبارية</button>
    <button onclick="selectGroup('kids')">🎈 أطفال</button>
    <button onclick="showPage('page1')">🔙 رجوع</button>
  </section>

  <!-- الصفحة 3: القنوات داخل المجموعة -->
  <section id="page3">
    <h2 id="groupTitle"></h2>
    <div id="channels"></div>
    <button onclick="showPage('page2')">🔙 رجوع</button>
  </section>

  <div class="note" id="note"></div>
  <a id="installLink" class="install-link" target="_blank">تحميل VLC</a>

  <script>
    function showPage(id) {
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function selectGroup(group) {
      showPage('page3');
      const title = document.getElementById('groupTitle');
      const list = document.getElementById('channels');
      list.innerHTML = '';

      let channels = [];

      if (group === 'sports') {
        title.innerText = '⚽ القنوات الرياضية';
        channels = [
          { name: 'Bein Sports 1', url: 'https://example.com/bein1.m3u8' },
          { name: 'Bein Sports 2', url: 'https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/manifest/video/576p1200kbps/video.m3u8' }
        ];
      } else if (group === 'news') {
        title.innerText = '📰 القنوات الإخبارية';
        channels = [
          { name: 'Al Jazeera', url: 'https://example.com/jazeera.m3u8' },
          { name: 'Sky News', url: 'https://example.com/sky.m3u8' }
        ];
      } else if (group === 'kids') {
        title.innerText = '🎈 قنوات الأطفال';
        channels = [
          { name: 'Spacetoon', url: 'https://example.com/spacetoon.m3u8' },
          { name: 'Toyor Al Janah', url: 'https://example.com/toyor.m3u8' }
        ];
      }

      channels.forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = ch.name;
        btn.onclick = () => openInVLC(ch.url);
        list.appendChild(btn);
      });
    }

    function openInVLC(streamUrl) {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const tempUrl = streamUrl + (streamUrl.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
      const note = document.getElementById("note");
      const installLink = document.getElementById("installLink");
      installLink.style.display = "none";

      let targetUrl = "";
      let downloadUrl = "";

      if (/android/i.test(userAgent)) {
        targetUrl = `intent://${tempUrl.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;end`;
        downloadUrl = "https://play.google.com/store/apps/details?id=org.videolan.vlc";
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        targetUrl = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(tempUrl)}`;
        downloadUrl = "https://apps.apple.com/app/vlc-for-mobile/id650377962";
      } else {
        targetUrl = `vlc://${tempUrl}`;
        downloadUrl = "https://www.videolan.org/vlc/";
      }

      window.location.href = targetUrl;

      // عرض الرسالة مرة واحدة فقط
      if (!localStorage.getItem('vlcPromptShown')) {
        setTimeout(() => {
          note.innerHTML = "⚠️ إذا لم يتم فتح VLC تلقائيًا، يمكنك تحميله من الرابط أدناه:";
          installLink.href = downloadUrl;
          installLink.style.display = "inline-block";
          localStorage.setItem('vlcPromptShown', 'true');
        }, 2000);
      }
    }
  </script>

</body>
</html>
