<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV + AdMob تجريبي</title>
<style>
  body { font-family: 'Cairo', sans-serif; background: #0a0a0a; color: #fff; text-align:center; padding:20px; }
  h1 { color: #00ffd1; text-shadow: 0 0 10px #00ffd1; }
  button { background:#00ffd1; border:none; border-radius:20px; padding:12px 25px; margin:10px; color:#000; cursor:pointer; }
  #bannerAd { width:320px; height:50px; background:#ffcc00; color:#000; line-height:50px; margin:20px auto; border-radius:10px; display:none; font-weight:bold; }
  #interstitialAd { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:#fff; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:9999; }
  #interstitialAd button { margin-top:20px; background:#00ffd1; color:#000; }
  .log { text-align:left; max-height:150px; overflow-y:auto; background:#111; padding:10px; border-radius:10px; margin-top:20px; }
</style>
</head>
<body>

<h1>💰 تجربة AdMob + IPTV</h1>

<button onclick="showBanner()">تشغيل بانر</button>
<button onclick="hideBanner()">إخفاء بانر</button>
<button onclick="showInterstitial()">إظهار إعلان بيني</button>

<div id="bannerAd">بانر إعلان تجريبي</div>

<div id="interstitialAd">
  <div>إعلان بيني تجريبي 🎬</div>
  <button onclick="closeInterstitial()">إغلاق الإعلان</button>
</div>

<div class="log" id="log">Logs:</div>

<script>
const banner = document.getElementById("bannerAd");
const interstitial = document.getElementById("interstitialAd");
const logEl = document.getElementById("log");

function log(msg){ logEl.innerHTML += '<br>➡️ '+msg; logEl.scrollTop = logEl.scrollHeight; }

function showBanner(){
  banner.style.display = "block";
  log("تم عرض بانر الإعلان التجريبي");
}
function hideBanner(){
  banner.style.display = "none";
  log("تم إخفاء بانر الإعلان");
}
function showInterstitial(){
  interstitial.style.display = "flex";
  log("تم عرض الإعلان البيني التجريبي");
}
function closeInterstitial(){
  interstitial.style.display = "none";
  log("تم إغلاق الإعلان البيني");
}
</script>

</body>
</html>
