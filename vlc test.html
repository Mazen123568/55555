<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشغيل البث في VLC</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      text-align: center;
      font-family: 'Cairo', sans-serif;
      padding: 40px;
    }

    button {
      background: linear-gradient(90deg, #00ffd1, #0072ff);
      border: none;
      border-radius: 30px;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ffd1;
    }
  </style>
</head>
<body>

  <h2>🎬 تشغيل البث عبر VLC</h2>
  <p>اضغط الزر لتشغيل البث في تطبيق VLC مباشرة</p>

  <button onclick="openInVLC('https://shls-live-enc.edgenextcdn.net/out/v1/b0b3a0e6750d4408bb86d703d5feffd1/index_24.m3u8')">
    تشغيل البث
  </button>

  <script>
    function openInVLC(streamUrl) {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isAndroid) {
        // Android: استخدام Intent لفتح VLC
        const intentUrl = `intent://${streamUrl.replace('https://', '')}#Intent;scheme=http;package=org.videolan.vlc;end`;
        window.location.href = intentUrl;
        setTimeout(() => {
          window.location.href = "https://play.google.com/store/apps/details?id=org.videolan.vlc";
        }, 2000);
      } 
      else if (isIOS) {
        // iOS: استخدام الرابط المخصص لـ VLC
        window.location.href = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(streamUrl)}`;
        setTimeout(() => {
          window.location.href = "https://apps.apple.com/app/vlc-for-mobile/id650377962";
        }, 2000);
      } 
      else {
        // للكمبيوتر
        window.location.href = `vlc://${streamUrl}`;
        setTimeout(() => {
          window.location.href = "https://www.videolan.org/vlc/";
        }, 2000);
      }
    }
  </script>

</body>
</html>
