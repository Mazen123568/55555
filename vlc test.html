<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشغيل البث في VLC</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0d0d0d;
      color: #fff;
      text-align: center;
      font-family: 'Cairo', sans-serif;
      padding: 40px;
    }

    button {
      background: linear-gradient(90deg, #00ffd1, #0072ff);
      border: none;
      border-radius: 30px;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ffd1;
    }

    p.note {
      color: #ccc;
      font-size: 15px;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <h2>🎬 تشغيل البث عبر VLC</h2>
  <p>اضغط الزر لتشغيل البث في تطبيق VLC مباشرة</p>

  <button onclick="openInVLC()">تشغيل البث</button>

  <p class="note">⚠️ إذا لم يُفتح VLC تلقائيًا، سيتم تحويلك إلى متجر Google Play أو App Store.</p>

  <script>
    function openInVLC() {
      const streamUrl = 'https://shls-live-enc.edgenextcdn.net/out/v1/08eca926a78a41339b8010c882410307/index_3.m3u8';
      const tempUrl = streamUrl + (streamUrl.includes('?') ? '&' : '?') + 'nocache=' + Date.now();

      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      const vlcUrl = 'vlc://' + tempUrl;
      const googlePlay = 'https://play.google.com/store/apps/details?id=org.videolan.vlc';
      const appStore = 'https://apps.apple.com/app/vlc-for-mobile/id650377962';

      // تنبيه لمرة واحدة فقط
      if (!localStorage.getItem('vlcHintShown')) {
        alert("📱 إذا لم يُفتح VLC تلقائيًا، سيتم نقلك إلى المتجر لتثبيته.");
        localStorage.setItem('vlcHintShown', 'true');
      }

      let opened = false;

      // محاولة فتح VLC مباشرة
      try {
        const win = window.open(vlcUrl, '_system');
        opened = true;
      } catch (e) {
        console.log("فتح VLC فشل:", e);
      }

      // خطة احتياطية: الانتظار قليلاً ثم الذهاب إلى المتجر المناسب
      setTimeout(() => {
        if (!opened) {
          if (isAndroid) {
            window.open(googlePlay, '_blank');
          } else if (isIOS) {
            window.open(appStore, '_blank');
          } else {
            alert("📺 افتح الرابط يدويًا في VLC على جهازك.");
          }
        }
      }, 2000);
    }
  </script>

</body>
</html>
